<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4f46e5;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Dynamic Pulsing Shapes -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="220" r="140" fill="#c084fc" opacity="0.15" filter="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Geometric Infrastructure Lines -->
  <path d="M-100 250 Q 300 150 600 260 T 1300 200" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4">
    <animate attributeName="d" values="M-100 250 Q 300 150 600 260 T 1300 200; M-100 230 Q 300 180 600 240 T 1300 220; M-100 250 Q 300 150 600 260 T 1300 200" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- Main Banner Header -->
  <g text-anchor="middle" transform="translate(600, 135)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1">
      🏛️ Awesome Public Works Management 🛠️
    </text>
  </g>

  <!-- Subtitle -->
  <g text-anchor="middle" transform="translate(600, 185)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#94a3b8" letter-spacing="0.5">
      Municipal Asset Management • GIS Integration • Work Orders • Infrastructure Capital Planning
    </text>
  </g>

  <!-- Accent Line under Title -->
  <rect x="350" y="210" width="500" height="4" rx="2" fill="url(#accentGrad)">
    <animate attributeName="width" values="400;550;400" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="400;325;400" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
